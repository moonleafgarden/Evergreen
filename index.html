<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Evergreen</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

</head>

<body>

<!-- Welcome -->
<section id="welcome" class="screen active">
...
</section>

<!-- Interests -->
<section id="interests" class="screen">
...
</section>

<!-- Home -->
<section id="home" class="screen">

    <header class="home-header">

        <h1>🌲 Evergreen</h1>

        <p>Grow a little every day.</p>

    </header>

    <main>

        <div class="progress-card">

            <h2>Today's Progress</h2>

            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>

            <p id="progressText">0 / 0 completed</p>

        </div>

        <div id="habitContainer"></div>

    </main>

</section>

<!-- Garden -->
<section id="garden" class="screen">

    <header>

        <h1>🌱 Garden</h1>

    </header>

    <main>

        <p>Your garden will grow here.</p>

    </main>

</section>

<!-- Statistics -->
<section id="progress" class="screen">

    <header>

        <h1>📊 Statistics</h1>

    </header>

    <main>

        <p>Coming soon...</p>

    </main>

</section>

<!-- Profile -->
<section id="profile" class="screen">

    <main>

        <div class="profile-header">

            <div class="profile-avatar">
                🌲
            </div>

            <h2>Madinabonu</h2>

            <p>Grow a little every day.</p>

        </div>

        <div class="profile-stats">

            <div class="profile-stat">

                <div>🔥</div>

                <h3 id="streakValue">0</h3>

                <p>Daily Streak</p>

            </div>

            <div class="profile-stat">

                <div>⭐</div>

                <h3 id="levelValue">1</h3>

                <p>Level</p>

            </div>

            <div class="profile-stat">

                <div>🌱</div>

                <h3 id="habitValue">0</h3>

                <p>Completed</p>

            </div>

        </div>

        <div class="profile-menu">

            <button id="changeInterestsBtn">
                🌱 Change Interests
            </button>

            <button id="statisticsBtn">
                📊 Statistics
            </button>

            <button id="appearanceBtn">
                🎨 Appearance
            </button>

            <button id="languageBtn">
                🌍 Language
            </button>

            <button id="aboutBtn">
                ℹ️ About Evergreen
            </button>

            <button id="resetBtn">
                🗑 Reset Progress
            </button>

        </div>

    </main>

</section>

<!-- Bottom Navigation -->

<nav class="bottom-nav">

    <button id="homeNav">
        🏠
        <span>Home</span>
    </button>

    <button id="gardenNav">
        🌱
        <span>Garden</span>
    </button>

    <button id="progressNav">
        📊
        <span>Statistics</span>
    </button>

    <button id="profileNav">
        👤
        <span>Profile</span>
    </button>

</nav>

<script src="interests.js"></script>
<script src="habits.js"></script>
<script src="app.js"></script>

</body>
